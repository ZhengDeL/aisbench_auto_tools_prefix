name: Validate public source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject private configuration and network addresses
        run: python3 add/validate_publication.py
      - name: Check add-on behavior without model requests
        run: python3 -B add/validate_addon.py
      - name: Check matrix parameter and result contracts
        run: python3 -B -m unittest discover -s add -p 'test_*.py'
